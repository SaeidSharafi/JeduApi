services:
  api:
    image: nexus.jedu.ir/repository/docker-hub/jedu-api:${API_TAG:-latest}
    container_name: jedu-api-test
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=testing
      - APP_DEBUG=true
      - APP_KEY=base64:H8vO144bE3Nf8lY/30c72Y2r75G7N8rIq3vG8N0w2I4=
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_DATABASE=jedu_testing
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_started

  postgres-test:
    image: groonga/pgroonga:latest-alpine-17
    container_name: jedu-postgres-test
    environment:
      - POSTGRES_DB=jedu_testing
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    tmpfs:
      - /var/lib/postgresql/data # In-memory DB for ultra-fast resets during tests
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: jedu-redis-test
    tmpfs:
      - /data
