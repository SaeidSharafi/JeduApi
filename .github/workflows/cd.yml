name: CD

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

jobs:
  deploy:
    name: Trigger Server-Side Deployment
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (to access event payload details if needed, optional)
        uses: actions/checkout@v4
        # This step is optional if you don't need to construct a complex payload
        # for the webhook from specific commit details not in the default event.

      - name: Send Deployment Webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          echo "Triggering deployment webhook to ${DEPLOY_WEBHOOK_URL}..."

          # Construct the payload. For Spatie's package, the content of the payload
          # is used to generate the signature, but often the job itself uses specific
          # fields like 'ref' or 'head_commit.id'.
          # We can send the original workflow_run event payload, or a custom one.
          # Let's send a simple payload that includes the commit SHA and ref.
          # The Spatie package will store the full request body anyway.

          # Get commit SHA from the workflow_run event
          COMMIT_SHA=$(jq -r '.workflow_run.head_commit.id' "$GITHUB_EVENT_PATH")
          REF_NAME=$(jq -r '.workflow_run.head_branch' "$GITHUB_EVENT_PATH") # This will be 'main'

          JSON_PAYLOAD=$(cat <<EOF
          {
            "event_name": "${{ github.event_name }}",
            "workflow_run_id": "${{ github.event.workflow_run.id }}",
            "repository": {
              "full_name": "${{ github.repository }}"
            },
            "ref": "refs/heads/${REF_NAME}",
            "head_commit": {
              "id": "${COMMIT_SHA}"
            }
          }
          EOF
          )

          # Generate the signature (HMAC SHA256)
          # Note: The Spatie package expects the raw request body for signature generation.
          # So, the JSON_PAYLOAD is what we need to sign.
          SIGNATURE=$(echo -n "$JSON_PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -binary | xxd -p -c 256)

          echo "Payload: $JSON_PAYLOAD"
          echo "Generated Signature: sha256=$SIGNATURE"

          # Send the webhook request
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-GitHub-Event: workflow_run_deployment_trigger" \ # Custom event name if you like
            -H "User-Agent: GitHub-Actions-CD-Workflow" \
            -d "$JSON_PAYLOAD" \
            "$DEPLOY_WEBHOOK_URL")

          echo "Webhook response code: $RESPONSE_CODE"

          if [ "$RESPONSE_CODE" -ge 200 ] && [ "$RESPONSE_CODE" -lt 300 ]; then
            echo "Webhook triggered successfully."
          else
            echo "Webhook trigger failed with status code $RESPONSE_CODE."
            # Optionally, fail the job if the webhook trigger fails.
            # exit 1
          fi
