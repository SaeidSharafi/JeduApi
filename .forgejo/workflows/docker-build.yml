name: Docker Build & Push

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to main/head)'
        required: false
        default: ''
      push:
        description: 'Push image to Nexus?'
        type: boolean
        required: true
        default: true

env:
  REGISTRY: nexus.jedu.ir
  IMAGE: repository/docker-hub/jedu-api
  PHP_BASE_IMAGE: nexus.jedu.ir/docker-hub-proxy/dunglas/frankenphp:1-php8.4
  COMPOSER_IMAGE: nexus.jedu.ir/docker-hub-proxy/library/composer:2

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # Guard: Run if manually dispatched OR if the triggering test workflow succeeded
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    env:
      SHOULD_PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push == true }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Checks out the exact commit that passed tests (or the manual input ref)
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.ref }}

      - name: Resolve image tags
        id: tags
        run: |
          set -eu
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAGS="${REGISTRY}/${IMAGE}:${SHORT_SHA}"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAGS="${REGISTRY}/${IMAGE}:${GITHUB_REF_NAME},${TAGS}"
          fi

          echo "tags=${TAGS},${REGISTRY}/${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS},${REGISTRY}/${IMAGE}:latest"

      - name: Login to Nexus registry
        if: env.SHOULD_PUSH == 'true'
        run: |
          set -eu
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login "${REGISTRY}" -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      - name: Build image (Dry Run)
        if: env.SHOULD_PUSH != 'true'
        run: |
          set -eu
          docker buildx build \
            --provenance=false \
            --sbom=false \
            -f docker/Dockerfile \
            --build-arg "PHP_BASE_IMAGE=${PHP_BASE_IMAGE}" \
            --build-arg "COMPOSER_IMAGE=${COMPOSER_IMAGE}" \
            .

      - name: Build and push image
        if: env.SHOULD_PUSH == 'true'
        run: |
          set -eu
          DOCKER_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && DOCKER_ARGS+=(-t "$tag")
          done < <(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n')

          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            -f docker/Dockerfile \
            --build-arg "PHP_BASE_IMAGE=${PHP_BASE_IMAGE}" \
            --build-arg "COMPOSER_IMAGE=${COMPOSER_IMAGE}" \
            "${DOCKER_ARGS[@]}" \
            .

      - name: Logout from Nexus registry
        if: always() && env.SHOULD_PUSH == 'true'
        run: docker logout "${REGISTRY}" || true
