name: Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'routes/**'
      - 'config/**'
      - 'database/**'
      - 'lang/**'
      - 'public/**'
      - 'resources/**'
      - 'bootstrap/**'
      - 'composer.json'
      - 'composer.lock'
      - 'artisan'
      - 'docker/**'
      - '.forgejo/workflows/docker-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to branch head)'
        required: false
        default: ''
      push:
        description: 'Push image to Nexus? Set false for a dry-run build.'
        required: false
        default: 'false'

env:
  REGISTRY: nexus.jedu.ir
  IMAGE: repository/docker-hub/jedu-api
  # Base images pulled through the Nexus docker-hub proxy so the runner
  # never needs direct Docker Hub egress. Adjust if your connector
  # maps official images differently (e.g. without the library/ prefix).
  PHP_BASE_IMAGE: nexus.jedu.ir/docker-hub-proxy/dunglas/frankenphp:1-php8.4
  COMPOSER_IMAGE: nexus.jedu.ir/docker-hub-proxy/library/composer:2

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    env:
      SHOULD_PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve image tags
        id: tags
        run: |
          set -eu
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAGS="${REGISTRY}/${IMAGE}:${SHORT_SHA}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${REGISTRY}/${IMAGE}:${GITHUB_REF_NAME},${TAGS}"
          fi

          echo "tags=${TAGS},${REGISTRY}/${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS},${REGISTRY}/${IMAGE}:latest"

      - name: Login to Nexus registry
        if: env.SHOULD_PUSH == 'true'
        run: |
          set -eu
          echo "${{ secrets.NEXUS_PASSWORD }}" | docker login "${REGISTRY}" -u "${{ secrets.NEXUS_USERNAME }}" --password-stdin

      - name: Build image
        if: env.SHOULD_PUSH != 'true'
        run: |
          set -eu
          docker buildx build \
            --provenance=false \
            --sbom=false \
            -f docker/Dockerfile \
            --build-arg "PHP_BASE_IMAGE=${PHP_BASE_IMAGE}" \
            --build-arg "COMPOSER_IMAGE=${COMPOSER_IMAGE}" \
            .

      - name: Build and push image
        if: env.SHOULD_PUSH == 'true'
        run: |
          set -eu
          DOCKER_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && DOCKER_ARGS+=(-t "$tag")
          done < <(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n')

          docker buildx build \
            --push \
            --provenance=false \
            --sbom=false \
            -f docker/Dockerfile \
            --build-arg "PHP_BASE_IMAGE=${PHP_BASE_IMAGE}" \
            --build-arg "COMPOSER_IMAGE=${COMPOSER_IMAGE}" \
            "${DOCKER_ARGS[@]}" \
            .

      - name: Logout from Nexus registry
        if: always() && env.SHOULD_PUSH == 'true'
        run: docker logout "${REGISTRY}"
