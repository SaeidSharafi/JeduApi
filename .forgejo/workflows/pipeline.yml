name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'lang/**'
      - 'config/**'
      - 'composer.json'
      - 'composer.lock'
      - '.env.example'
      - 'phpunit.xml'
      - 'routes/**'
      - '.forgejo/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Run migrations? (true/false)'
        required: false
        default: 'false'

jobs:
  # =========================================================================
  # JOB 1: Run the Test Suite
  # =========================================================================
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: nexus.jedu.ir/docker-hub/php-ci:8.4

    services:
      postgres:
        image: nexus.jedu.ir/docker-hub-proxy/groonga/pgroonga:latest-alpine-17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.test', '.env');"

      - name: Configure Composer to use Nexus
        run: |
          composer config --global repos.packagist composer https://nexus.jedu.ir/repository/composer-proxy/

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GH_TOKEN }}"}}'

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Database Migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: php artisan migrate:fresh --seed --force

      - name: Execute tests (Pest)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
          XDEBUG_MODE: coverage
        run: ./vendor/bin/pest --parallel --coverage --coverage-clover=coverage.xml --log-junit junit.xml

  # =========================================================================
  # JOB 2: Deploy API (Only executes if tests pass)
  # =========================================================================
  deploy:
    name: Deploy API
    needs: tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest # Matches the label registered in your runner-config.yml
    container:
      # Using the Nexus proxy path ensures it pulls successfully through your network setup
      image: nexus.jedu.ir/docker-hub/php-ci:8.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Deployer
        run: |
          curl -LO https://nexus.jedu.ir/repository/raw-assets/deployer/deployer.phar
          chmod +x deployer.phar
          mv deployer.phar /usr/local/bin/dep

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        #run: dep deploy production -o migrate=${{ github.event.inputs.migrate || 'false' }}
        # we are still in development phase so it should always run with migrate-fresh=true, we will change it later
        run: dep deploy production -o migrate-fresh=true
      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
