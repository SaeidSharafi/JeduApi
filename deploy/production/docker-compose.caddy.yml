# Mode file: Caddy is the edge and terminates TLS itself (edge=caddy).
#
# Selected by install.sh through COMPOSE_FILE. Caddy obtains and renews
# certificates, publishes the public ports and routes by hostname.
services:
  caddy:
    ports:
      - "${CADDY_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${CADDY_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${CADDY_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp" # HTTP/3
