# Jedu production stack.
#
#   caddy ──┬─> api:8000    JEDU_API_IMAGE    (FrankenPHP; the image runs its own Caddy)
#           ├─> shop:80     JEDU_SHOP_IMAGE   (Next.js standalone server)
#           └─> admin:80    JEDU_ADMIN_IMAGE  (nginx serving the Vite build)
#
#   worker           the same JEDU_API_IMAGE with DEPLOYMENT_TYPE=worker (Horizon + scheduler)
#   postgres         pgroonga image: a migration runs CREATE EXTENSION pgroonga
#   redis            cache, sessions, queues (Horizon)
#   typesense        SCOUT_DRIVER=typesense
#
# This file is the shared core. install.sh selects what actually runs by writing
# COMPOSE_PROFILES and COMPOSE_FILE into .env, so every plain `docker compose`
# command afterwards resolves the same topology:
#
#   profiles      caddy | admin | db-bundled | redis-bundled | typesense-bundled
#   mode files    docker-compose.caddy.yml               Caddy terminates TLS itself
#                 docker-compose.caddy-behind-edge.yml   Caddy is an HTTP router
#                 docker-compose.external-net.yml        datastore is another container
#
# Only the routing layer publishes a public port. api, shop and admin are
# published on 127.0.0.1 only, because the host nginx of the `nginx` router mode
# proxies to them; Caddy modes reach them over the compose network by service
# name. STOREFRONT_URL is deliberately http://shop:80: that is the address the
# API *container* can reach the storefront on, not the browser-facing domain
# (see config/storefront.php and .ai/rules/storefront-cache.md — reusing the
# public host produced cURL error 7).
#
# Configuration lives in ./.env, written by ./install.sh. The Laravel variables
# that are derivable from the domains are computed here instead of being stored
# twice, so a domain change is a one-line edit.
#
#   ./install.sh          writes .env and starts everything
#   docker compose config  prints the fully resolved configuration

name: jedu-production

x-api-environment: &api-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${PUBLIC_SCHEME:?PUBLIC_SCHEME is missing - run install.sh}://${API_DOMAIN:?API_DOMAIN is missing - run install.sh}
  # Browser-facing host used by the payment redirects (config/payments.php).
  FRONTEND_SHOP_DOMAIN: ${PUBLIC_SCHEME}://${SHOP_DOMAIN:?SHOP_DOMAIN is missing - run install.sh}
  # Origins allowed to make cookie-authenticated requests to the API.
  SANCTUM_STATEFUL_DOMAINS: ${ADMIN_DOMAIN:?},${SHOP_DOMAIN:?},${API_DOMAIN:?}
  # Topology facts, not operator choices. Each host/port is written by
  # install.sh for the mode chosen for that datastore.
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:?DB_HOST is missing - run install.sh}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${POSTGRES_DB:?}
  DB_USERNAME: ${POSTGRES_USER:?}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-}
  REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is missing - run install.sh}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_CLIENT: phpredis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SCOUT_DRIVER: ${SCOUT_DRIVER:-typesense}
  TYPESENSE_HOST: ${TYPESENSE_HOST:?TYPESENSE_HOST is missing - run install.sh}
  TYPESENSE_PORT: ${TYPESENSE_PORT:-8108}
  TYPESENSE_PROTOCOL: ${TYPESENSE_PROTOCOL:-http}
  TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-}
  # Must equal the shop container's REVALIDATE_SECRET; a mismatch is a silent
  # no-op that leaves the storefront serving stale content until its TTL.
  STOREFRONT_URL: http://shop:80
  STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:?}

x-api-service: &api-service
  image: ${JEDU_API_IMAGE:?JEDU_API_IMAGE is missing - run install.sh}
  restart: unless-stopped
  stop_grace_period: 60s
  env_file:
    - .env
  environment: *api-environment
  volumes:
    # Keep persistent application files beside this deployment for direct
    # backup and cleanup. install.sh prepares appuser ownership on these paths.
    - "${JEDU_DATA_DIR:-./data}/storage/app:/app/storage/app"
    - "${JEDU_DATA_DIR:-./data}/storage/logs:/app/storage/logs"
  # No depends_on on the datastores on purpose: they may be external, and a
  # compose dependency on a profile that is not enabled is a hard error ("api
  # depends on undefined service postgres"). The image entrypoint waits for
  # DB_HOST and REDIS_HOST over TCP before starting anything else.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - jedu

services:
  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is missing - run install.sh}
    container_name: jedu-caddy
    restart: unless-stopped
    # Enabled only when install.sh makes Caddy the routing layer (edge=caddy, or
    # edge=external with router=caddy). Plain nginx-router installs leave it off.
    profiles: ["caddy"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      SHOP_DOMAIN: ${SHOP_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      # "email ops@jedu.ir" when Caddy runs ACME, empty otherwise.
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      # "http://" when TLS is terminated upstream, empty when Caddy terminates it.
      CADDY_SITE_ADDRESS_PREFIX: ${CADDY_SITE_ADDRESS_PREFIX:-}
      # The admin hostname, or a placeholder while --skip-admin keeps the panel
      # out of the stack.
      CADDY_ADMIN_SITE: ${CADDY_ADMIN_SITE:?}
      CADDY_ADMIN_UPSTREAM: ${CADDY_ADMIN_UPSTREAM:-admin:80}
      # Comma-free, space-separated CIDRs of the upstream edge (behind-edge mode);
      # Caddy trusts their X-Forwarded-* headers, otherwise the app sees the edge.
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-}
      # Public port the browser used; forwarded as X-Forwarded-Port so absolute
      # URLs do not come out as https://host:8000.
      CADDY_XFP_PORT: ${CADDY_XFP_PORT:-443}
    volumes:
      # install.sh selects this file; the two variants are Caddyfile (Caddy is
      # the edge) and Caddyfile.behind-edge (plain HTTP router).
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - "${JEDU_DATA_DIR:-./data}/caddy/data:/data"
      - "${JEDU_DATA_DIR:-./data}/caddy/config:/config"
    # depends_on intentionally omits admin: install.sh --skip-admin starts the
    # stack without it, and Caddy then answers 502 for the admin host until the
    # image is published and the stack is restarted without the flag.
    depends_on:
      api:
        condition: service_started
      shop:
        condition: service_started
    networks:
      - jedu

  api:
    <<: *api-service
    container_name: jedu-api
    environment:
      <<: *api-environment
      DEPLOYMENT_TYPE: web
    # Loopback only: the host nginx of router=nginx proxies here; in Caddy modes
    # it is a debugging convenience. It is never reachable from the network.
    ports:
      - "127.0.0.1:${API_LOOPBACK_PORT:-8000}:8000"
    # Inherits the image's HEALTHCHECK (curl -f http://localhost:8000/up).

  worker:
    <<: *api-service
    container_name: jedu-worker
    # The image healthcheck probes the web server at :8000, but this container
    # runs Horizon and the scheduler instead. Its process supervisor restarts
    # failed workers; an HTTP check would always mark this service unhealthy.
    healthcheck:
      disable: true
    # Horizon finishes in-flight jobs on SIGTERM, so give Docker more than the
    # 10s default before it SIGKILLs the container.
    stop_grace_period: 120s
    environment:
      <<: *api-environment
      DEPLOYMENT_TYPE: worker

  shop:
    image: ${JEDU_SHOP_IMAGE:?JEDU_SHOP_IMAGE is missing - run install.sh}
    container_name: jedu-shop
    restart: unless-stopped
    environment:
      # Next reads these per request from the container env (see the shop's
      # .env.example), which is what lets one image serve every environment.
      NEXT_PUBLIC_API_URL: ${PUBLIC_SCHEME}://${API_DOMAIN}/api/v1/shop
      NEXT_PUBLIC_AUTH_API_URL: ${PUBLIC_SCHEME}://${API_DOMAIN}/api/v1/auth
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SCHEME}://${SHOP_DOMAIN}
      REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:?}
    ports:
      - "127.0.0.1:${SHOP_LOOPBACK_PORT:-8081}:80"
    networks:
      - jedu

  admin:
    image: ${JEDU_ADMIN_IMAGE:?JEDU_ADMIN_IMAGE is missing - run install.sh}
    container_name: jedu-admin
    restart: unless-stopped
    # --skip-admin leaves this profile off; the image is still referenced by the
    # compose file, so its tag must exist (install.sh keeps the last one).
    profiles: ["admin"]
    environment:
      # The image's nginx entrypoint turns this into /env-config.js at container
      # start, which is what lets one image serve every environment. It must not
      # be baked in at build time — see the admin panel's .env.example.
      VITE_API_URL: ${PUBLIC_SCHEME}://${API_DOMAIN}/api/v1/admin
    ports:
      - "127.0.0.1:${ADMIN_LOOPBACK_PORT:-8082}:80"
    networks:
      - jedu

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is missing - run install.sh}
    container_name: jedu-postgres
    restart: unless-stopped
    # db-bundled only; an external or containerised PostgreSQL leaves this off.
    profiles: ["db-bundled"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Only used by the healthcheck below.
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    # The dev stack sets the same lock ceiling; the app's transactions need it.
    command: postgres -c max_locks_per_transaction=${POSTGRES_MAX_LOCKS:-256}
    volumes:
      - "${JEDU_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - jedu

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is missing - run install.sh}
    container_name: jedu-redis
    restart: unless-stopped
    profiles: ["redis-bundled"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - "${JEDU_DATA_DIR:-./data}/redis:/data"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - jedu

  typesense:
    image: ${TYPESENSE_IMAGE:?TYPESENSE_IMAGE is missing - run install.sh}
    container_name: jedu-typesense
    restart: unless-stopped
    profiles: ["typesense-bundled"]
    environment:
      TYPESENSE_DATA_DIR: /typesense-data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-}
      TYPESENSE_ENABLE_CORS: "false"
    volumes:
      - "${JEDU_DATA_DIR:-./data}/typesense:/typesense-data"
    healthcheck:
      # The dev compose's healthcheck used wget, which is not in this image.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8108'"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s
    networks:
      - jedu

networks:
  jedu:
    name: jedu-production
    driver: bridge
