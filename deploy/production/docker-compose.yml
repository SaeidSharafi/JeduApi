# Jedu production stack.
#
#   caddy ──┬─> api:8000    JEDU_API_IMAGE    (FrankenPHP; the image runs its own Caddy)
#           ├─> shop:80     JEDU_SHOP_IMAGE   (Next.js standalone server)
#           └─> admin:80    JEDU_ADMIN_IMAGE  (nginx serving the Vite build)
#
#   worker           the same JEDU_API_IMAGE with DEPLOYMENT_TYPE=worker (Horizon + scheduler)
#   postgres         pgroonga image: a migration runs CREATE EXTENSION pgroonga
#   redis            cache, sessions, queues (Horizon)
#   typesense        SCOUT_DRIVER=typesense
#
# Only caddy publishes ports. Every other service is reached over the compose
# network by service name, which is why STOREFRONT_URL below is http://shop:80:
# that is the address the API *container* can reach the storefront on, and it is
# deliberately not the browser-facing shop domain (see config/storefront.php and
# .ai/rules/storefront-cache.md — reusing the public host produced cURL error 7).
#
# Configuration lives in ./.env, written by ./install.sh. The Laravel variables
# that are derivable from the three domains are computed here instead of being
# stored twice, so a domain change is a one-line edit.
#
#   ./install.sh          writes .env and starts everything
#   docker compose config  prints the fully resolved configuration

name: jedu-production

x-api-environment: &api-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${PUBLIC_SCHEME:?PUBLIC_SCHEME is missing - run install.sh}://${API_DOMAIN:?API_DOMAIN is missing - run install.sh}
  # Browser-facing host used by the payment redirects (config/payments.php).
  FRONTEND_SHOP_DOMAIN: ${PUBLIC_SCHEME}://${SHOP_DOMAIN:?SHOP_DOMAIN is missing - run install.sh}
  # Origins allowed to make cookie-authenticated requests to the API.
  SANCTUM_STATEFUL_DOMAINS: ${ADMIN_DOMAIN:?},${SHOP_DOMAIN:?},${API_DOMAIN:?}
  # Topology facts, not operator choices.
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:?}
  DB_USERNAME: ${POSTGRES_USER:?}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CLIENT: phpredis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SCOUT_DRIVER: typesense
  TYPESENSE_HOST: typesense
  TYPESENSE_PORT: "8108"
  TYPESENSE_PROTOCOL: http
  TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?}
  # Must equal the shop container's REVALIDATE_SECRET; a mismatch is a silent
  # no-op that leaves the storefront serving stale content until its TTL.
  STOREFRONT_URL: http://shop:80
  STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:?}

x-api-service: &api-service
  image: ${JEDU_API_IMAGE:?JEDU_API_IMAGE is missing - run install.sh}
  restart: unless-stopped
  stop_grace_period: 60s
  env_file:
    - .env
  environment: *api-environment
  volumes:
    # Named volumes, not bind mounts: the image's appuser (uid 1000) owns
    # /app/storage, and Docker copies that ownership into a fresh named volume.
    # A bind mount would need the host directory chowned to 1000:1000 first.
    - storage-app:/app/storage/app
    - storage-logs:/app/storage/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - jedu

services:
  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is missing - run install.sh}
    container_name: jedu-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      SHOP_DOMAIN: ${SHOP_DOMAIN:?}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?}
      # "email ops@jedu.ir" when TLS is on, empty when --no-tls (see install.sh).
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      # "http://" when TLS is off, empty when Caddy terminates TLS itself.
      CADDY_SITE_ADDRESS_PREFIX: ${CADDY_SITE_ADDRESS_PREFIX:-}
      # The admin hostname, or a placeholder while install.sh --skip-admin keeps
      # the panel out of the stack.
      CADDY_ADMIN_SITE: ${CADDY_ADMIN_SITE:?}
      CADDY_ADMIN_UPSTREAM: ${CADDY_ADMIN_UPSTREAM:-admin:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # depends_on intentionally omits admin: install.sh --skip-admin starts the
    # stack without it, and Caddy then answers 502 for the admin host until the
    # image is published and the stack is restarted without the flag.
    depends_on:
      api:
        condition: service_started
      shop:
        condition: service_started
    networks:
      - jedu

  api:
    <<: *api-service
    container_name: jedu-api
    environment:
      <<: *api-environment
      DEPLOYMENT_TYPE: web
    # Inherits the image's HEALTHCHECK (curl -f http://localhost:8000/up).

  worker:
    <<: *api-service
    container_name: jedu-worker
    # Horizon finishes in-flight jobs on SIGTERM, so give Docker more than the
    # 10s default before it SIGKILLs the container.
    stop_grace_period: 120s
    environment:
      <<: *api-environment
      DEPLOYMENT_TYPE: worker

  shop:
    image: ${JEDU_SHOP_IMAGE:?JEDU_SHOP_IMAGE is missing - run install.sh}
    container_name: jedu-shop
    restart: unless-stopped
    environment:
      # Next reads these per request from the container env (see the shop's
      # .env.example), which is what lets one image serve every environment.
      NEXT_PUBLIC_API_URL: ${PUBLIC_SCHEME}://${API_DOMAIN}/api/v1/shop
      NEXT_PUBLIC_AUTH_API_URL: ${PUBLIC_SCHEME}://${API_DOMAIN}/api/v1/auth
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SCHEME}://${SHOP_DOMAIN}
      REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:?}
    networks:
      - jedu

  admin:
    image: ${JEDU_ADMIN_IMAGE:?JEDU_ADMIN_IMAGE is missing - run install.sh}
    container_name: jedu-admin
    restart: unless-stopped
    environment:
      # The image's nginx entrypoint turns this into /env-config.js at container
      # start, which is what lets one image serve every environment. It must not
      # be baked in at build time — see the admin panel's .env.example.
      VITE_API_URL: ${PUBLIC_SCHEME}://${API_DOMAIN}/api/v1/admin
    networks:
      - jedu

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is missing - run install.sh}
    container_name: jedu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Only used by the healthcheck below.
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    # The dev stack sets the same lock ceiling; the app's transactions need it.
    command: postgres -c max_locks_per_transaction=${POSTGRES_MAX_LOCKS:-256}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - jedu

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is missing - run install.sh}
    container_name: jedu-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - jedu

  typesense:
    image: ${TYPESENSE_IMAGE:?TYPESENSE_IMAGE is missing - run install.sh}
    container_name: jedu-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /typesense-data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?}
      TYPESENSE_ENABLE_CORS: "false"
    volumes:
      - typesense-data:/typesense-data
    healthcheck:
      # The dev compose's healthcheck used wget, which is not in this image.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8108'"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s
    networks:
      - jedu

volumes:
  postgres-data:
    name: jedu-postgres-data
  redis-data:
    name: jedu-redis-data
  typesense-data:
    name: jedu-typesense-data
  storage-app:
    name: jedu-storage-app
  storage-logs:
    name: jedu-storage-logs
  caddy-data:
    name: jedu-caddy-data
  caddy-config:
    name: jedu-caddy-config

networks:
  jedu:
    name: jedu-production
    driver: bridge
